  <!-- Main Content -->
  <div class="container mx-auto px-4 py-12">
    <div class="text-center mb-12">
      <span class="text-indigo-600 font-semibold text-xs uppercase tracking-wide">Math Tool</span>
      <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mt-2 mb-4">Calculator</h1>
      <div class="w-24 h-1 bg-indigo-600 mx-auto"></div>
      <p class="text-sm text-gray-600 mt-4 max-w-2xl mx-auto">Kalkulator sederhana untuk perhitungan matematika dasar</p>
    </div>

    <div class="flex justify-center">
      <div class="calculator bg-gray-50 p-8 border-2 border-gray-200 rounded-2xl">
        <div class="display bg-white rounded-lg p-4 mb-6 border border-gray-300">
          <input type="text" class="text-right w-full text-3xl font-bold font-mono bg-white outline-none" id="result" value="0" disabled>
        </div>
        <div class="keys grid grid-cols-4 gap-3">
          <button class="button-number" onclick="updateDisplay('7')">7</button>
          <button class="button-number" onclick="updateDisplay('8')">8</button>
          <button class="button-number" onclick="updateDisplay('9')">9</button>
          <button class="operator" onclick="updateDisplay('x')">×</button>

          <button class="button-number" onclick="updateDisplay('4')">4</button>
          <button class="button-number" onclick="updateDisplay('5')">5</button>
          <button class="button-number" onclick="updateDisplay('6')">6</button>
          <button class="operator" onclick="updateDisplay('-')">−</button>

          <button class="button-number" onclick="updateDisplay('1')">1</button>
          <button class="button-number" onclick="updateDisplay('2')">2</button>
          <button class="button-number" onclick="updateDisplay('3')">3</button>
          <button class="operator" onclick="updateDisplay('+')">+</button>

          <button class="button-clear" onclick="clearDisplay()">C</button>
          <button class="button-number" onclick="updateDisplay('0')">0</button>
          <button class="operator" onclick="updateDisplay('/')">÷</button>
          <button class="button-equal" onclick="calculate('equal')">=</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-gray-900 text-white mt-20">
    <div class="container mx-auto px-6 py-8">
      <div class="text-center">
        <p class="text-gray-400 text-sm">&copy; 2025 MyTools. Made with ❤ by Anrekus.</p>
      </div>
    </div>
  </footer>

  <style type="text/tailwindcss">
    @layer components {
      .button-number {
        @apply bg-white text-gray-800 font-bold rounded-lg w-16 h-16 flex justify-center items-center text-xl border border-gray-300 hover:bg-gray-100 transition-colors;
      }
      .operator {
        @apply bg-indigo-100 text-indigo-700 font-bold rounded-lg w-16 h-16 flex justify-center items-center text-2xl border border-indigo-200 hover:bg-indigo-200 transition-colors;
      }
      .button-clear {
        @apply bg-red-500 text-white font-bold rounded-lg w-16 h-16 flex justify-center items-center text-xl hover:bg-red-600 transition-colors;
      }
      .button-equal {
        @apply bg-indigo-600 text-white font-bold rounded-lg w-16 h-16 flex justify-center items-center text-2xl hover:bg-indigo-700 transition-colors;
      }
    }
  </style>

  <script>
    function updateDisplay(value) {
      const display = document.getElementById('result');
      if (display.value === '0') {
        display.value = value;
      } else {
        display.value += value;
      }
    }

    function clearDisplay() {
      const display = document.getElementById('result');
      display.value = '0';
    }

    function calculate(operator) {
      const display = document.getElementById('result');
      const value = display.value;
      
      if (value.includes('+') || value.includes('-') || value.includes('x') || value.includes('/')) {
        const values = value.split(/(\+|-|x|\/)/);
        const firstNumber = parseFloat(values[0]);
        const operator = values[1];
        const secondNumber = parseFloat(values[2]);
        
        if (isNaN(firstNumber) || isNaN(secondNumber)) {
          display.value = 'Error';
          setTimeout(() => clearDisplay(), 1000);
          return;
        }
        
        let result;
        if (operator === '+') {
          result = firstNumber + secondNumber;
        } else if (operator === '-') {
          result = firstNumber - secondNumber;
        } else if (operator === 'x') {
          result = firstNumber * secondNumber;
        } else if (operator === '/') {
          if (secondNumber === 0) {
            display.value = 'Error';
            setTimeout(() => clearDisplay(), 1000);
            return;
          }
          result = firstNumber / secondNumber;
        }
        
        if (Number.isInteger(result)) {
          display.value = result;
        } else {
          display.value = result.toFixed(2);
        }
      }
    }
  </script>
</body>

</html>
